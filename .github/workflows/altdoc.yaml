name: Build documentation

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('altdoc-pr-{0}', github.event.pull_request.number) || 'altdoc-pages' }}
  cancel-in-progress: false

permissions: read-all

jobs:
  altdoc:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: altdoc/requirements.txt

      - name: Install MkDocs
        run: |
          python -m venv .venv_altdoc
          .venv_altdoc/bin/python -m pip install --requirement altdoc/requirements.txt

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: website

      - name: Build site
        run: altdoc::render_docs(freeze = FALSE, parallel = FALSE, verbose = TRUE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/master' ||
          startsWith(github.ref, 'refs/tags/'))
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: true
          clean-exclude: dev
          branch: gh-pages
          folder: docs
